<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escala 7º GB</title>
<style>
:root{--alfa:#c6e0b4;--bravo:#ffe699;--charlie:#9fc5e8;--delta:#d9d9d9;

*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,Segoe UI,Arial,sans-serif;background:#f8f9fa;color:#212529}
header{background:#1f3b5c;color:#fff;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
header .comp{font-weight:400;opacity:.85}
.acoes{display:flex;gap:6px;margin-left:auto;align-items:center}
.acoes button,.acoes label{background:transparent;border:1px solid rgba(255,255,255,.45);

font-weight:400;min-width:104px;height:30px;text-align:center;display:inline-flex;
align-items:center;justify-content:center;box-sizing:border-box;line-height:1}
.acoes button:hover,.acoes label:hover{background:rgba(255,255,255,.15)}
nav{display:flex;gap:4px;padding:10px 16px;background:#e9ecef;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;position:fixed;bottom:0;left:0;right:0;z-index:60;border-top:1px solid #ced4da}
nav button{border:1px solid #ced4da;background:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
nav button.active{background:#1f3b5c;color:#fff;border-color:#1f3b5c}
main{padding:12px 16px 250px;max-width:1600px;margin:0 auto;width:100%}
table.diario{margin:0 auto}
main > table{margin:0 auto;width:max-content}
table{border-collapse:separate;border-spacing:0;background:#fff;font-size:12px}
th,td{border-right:1px solid var(--linha);border-bottom:1px solid var(--linha);padding:0;text-align:center;height:24px}
th{background:#4a6fa5;color:#fff;font-weight:600;padding:4px 6px;position:sticky;top:0;z-index:2}
td.nome{text-align:left;padding:2px 8px;min-width:250px;white-space:nowrap}
td.num{width:34px;color:#6c757d}
td.dia{width:30px;cursor:pointer;user-select:none}
td.dia:hover{outline:2px solid #1f3b5c;outline-offset:-2px}
td.fds{}
td.x{background:#e2efda}.t-pj{background:#ddebf7}.t-pj12{background:#d9f2f4}
.t-sb{background:#f2f2f2;color:#888}.t-n{background:#eee;color:#aaa}
.falta{background:#f8d7da!important;color:#842029;font-weight:700}
.sbcell{font-weight:700;background:#eef2f7;text-align:center;vertical-align:middle;font-size:13px}
.ok{color:#198754;font-size:10px}
tr.g0 td.escala{background:var(--alfa)}tr.g1 td.escala{background:var(--bravo)}
tr.g2 td.escala{background:var(--charlie)}tr.g3 td.escala{background:var(--delta)}
tr.g4 td.escala{background:var(--adm)}
td.escala,td.mot{width:60px;font-size:11px}
.setor{margin:18px 0 6px;font-weight:700;color:#1f3b5c;font-size:13px}
thead th{position:sticky;top:0;z-index:5}
tr.tit td{position:sticky;top:0;z-index:7;background:#1f3864!important}
tr.cab th{position:sticky;top:26px;z-index:6;background:#4a6fa5!important}
table{background:#fff}
.tot td, .tot th{
  font-weight:700;
  background-color:#f1f3f5!important;
  font-size:11px;
  line-height:22px;
  height:24px;
  max-height:24px;
  padding:0 2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  vertical-align:middle;
  box-sizing:border-box;
  position:sticky;
  z-index:20;
}
.tot td.falta{
  background-color:#f8d7da!important;color:#842029!important;
  white-space:normal;line-height:11px;font-size:10px;padding:2px 0;
  height:auto;max-height:none;vertical-align:middle;
}
.tot td.ok{background-color:#d9ead3!important;color:#14532d!important}
#menu{position:fixed;z-index:99;background:#fff;border:1px solid #adb5bd;border-radius:8px;
box-shadow:0 6px 20px rgba(0,0,0,.18);padding:6px;display:none;grid-template-columns:repeat(4,1fr);gap:4px}
#menu button{border:1px solid #ced4da;background:#fff;border-radius:5px;padding:6px 10px;cursor:pointer;font-size:12px}
#menu button:hover{background:#e9ecef}
footer{position:fixed;bottom:48px;left:0;right:0;background:#fff;border-top:1px solid var(--linha);
padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;z-index:59}
footer button{padding:5px 12px;border:1px solid #adb5bd;border-radius:6px;background:#fff;cursor:pointer}
@media print{header,nav,footer{display:none}main{padding:0}td.dia{cursor:default}}

const ORDEM_ESC = {"ALFA":0,"BRAVO":1,"CHARLIE":2,"DELTA":3,"ADM":4};
const COR_X = {"ALFA":"#548235","BRAVO":"#bf9000","CHARLIE":"#2e75b6","DELTA":"#595959","ADM":"#5fa8a3"};
const COR_COD = {"PJ":"#7030a0","PJ12":"#00b0f0","PJ12H":"#00897b","S1":"#c55a11",
                 "SPJ":"#e3008c","SB":"#a6a6a6","N":"#ff0000","12":"#8d6e63","24":"#37474f"};
function pintar(td, v, escala){
  if (!v) return;
  if (v==="X" && COR_X[escala]) { td.style.background = COR_X[escala]; td.style.color="#fff"; td.style.fontWeight="700"; }
  else if (COR_COD[v]) { td.style.background = COR_COD[v]; td.style.color = (v==="SB")?"#333":"#fff"; td.style.fontWeight="700"; }
}
const SBS = ["1ªSB","2ªSB","3ªSB","4ªSB"];
let marks = D.marks || {};
let vis = D.vis || {};
let aco = D.aco || [];
let abaAtual = "1ªSB";
let abaVis = "1ªSB";

function competencia(){ const d = new Date(D.competencia+"T12:00:00"); return d; }
function diasDoMes(){
  const d = competencia(); const y = d.getFullYear(), m = d.getMonth();
  const ultimo = new Date(y, m+1, 0).getDate();
  const out = [];
  for (let i=1;i<=ultimo;i++) out.push(new Date(y,m,i));
  return out;
}
function fmt(d){
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function ehFeriado(d){ return D.feriados.includes(fmt(d)); }
function ehFds(d){ const w=d.getDay(); return w===0||w===6; }
function corDia(d){ return ehFeriado(d) ? "#8b0000" : (ehFds(d) ? "#c0504d" : ""); }
function fimDeSemanaOuFeriado(d){ return ehFeriado(d)||ehFds(d); }
function pessoasDaSecao(sec){
  return D.mes.filter(m=>m.secao===sec && m.adm!=="S")
    .map(m=>({...m, p: D.pessoas.find(p=>p.id===m.id)||{posto:"",nome:m.id}}))
    .sort((a,b)=>{
      const oa = ORDEM_ESC[a.escala] ?? 9, ob = ORDEM_ESC[b.escala] ?? 9;
      if (oa!==ob) return oa-ob;
      return (a.p.ordem||999)-(b.p.ordem||999);
    });
}
function pessoasAdm(sb){
  return D.mes.filter(m=>m.adm==="S" && (m.secao===sb || (sb==="1ªSB" && m.secao==="ADM")))
    .map(m=>({...m, p: D.pessoas.find(p=>p.id===m.id)||{posto:"",nome:m.id}}))
    .sort((a,b)=>(a.p.ordem||999)-(b.p.ordem||999));
}
function pessoasDaSB(sb){
  return pessoasDaSecao(sb).concat(pessoasAdm(sb));
}
function nomeCompleto(p){ return (p.posto+" "+p.id+" "+p.nome).trim(); }

function conflito(id,dia,grupo){
  for (const k in marks){
    const p = k.split("|");
    if (p[1]===id && p[2]===dia && p[0]!==grupo) return p[0];
  }
  return null;
}
function marcar(grupo,id,dia,cod){
  const k = grupo+"|"+id+"|"+dia;
  if (!cod){ delete marks[k]; salvarLocal(); return true; }
  const outro = conflito(id,dia,grupo);
  if (outro){ const br = dia.split("-").reverse().join("/"); const nome = (outro==="ADM") ? "1ª SB - ADM" : outro; alert("Conflito: este militar já tem serviço no dia "+br+" ("+nome+")"); return false; }
  marks[k]=cod; salvarLocal(); return true;
}
function getMark(grupo,id,dia){
  const k0 = grupo+"|"+id+"|"+dia;
  if (marks[k0]) return marks[k0];
  for (const k in marks){ const p=k.split("|"); if(p[1]===id && p[2]===dia) return marks[k]; }
  return "";
}
function donoDaMarca(grupo,id,dia){
  for (const k in marks){ const p=k.split("|"); if(p[1]===id && p[2]===dia) return p[0]; }
  return null;
}

function desenhar(){
  document.getElementById("comp").textContent = competencia().toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  [...SBS,"ACO","VISITANTES","DIARIO","OPERACIONAL"].forEach(t=>{
    const b = document.createElement("button");
    b.textContent = t; b.className = (t===abaAtual?"active":"");
    b.onclick = ()=>{ abaAtual=t; desenhar(); };
    nav.appendChild(b);
  });
  const main = document.getElementById("main");
  main.innerHTML = "";
  if (SBS.includes(abaAtual)) desenharGrade2(main, abaAtual);
  else if (abaAtual==="ACO") desenharAco(main);
  else if (abaAtual==="VISITANTES") desenharVisitantes(main);
  else if (abaAtual==="DIARIO") desenharDiario(main);
  else desenharOperacional2(main);
}

function tabelaMarcavel(main, titulo, grupo, linhas, codigos, aoEscolher){
  const dias = diasDoMes();
  const t = document.createElement("table");
  let h = "<thead><tr><th>"+titulo+"</th>";
  dias.forEach(d=>{
    const cor = corDia(d);
    h += "<th"+(cor?" style='color:"+cor+"'":"")+">"+String(d.getDate()).padStart(2,"0")+"</th>";
  });
  h += "</tr></thead><tbody>";
  t.innerHTML = h;
  linhas.forEach((linha, idx)=>{
    const tr = document.createElement("tr");
    const tdNome = document.createElement("td");
    tdNome.className = "nome";
    if (aoEscolher){
      const sel = document.createElement("select");
      sel.style.cssText = "width:100%;font-size:12px;padding:2px";
      sel.innerHTML = "<option value=''>—</option>" + D.pessoas.map(p=>{
        const mm = D.mes.find(x=>x.id===p.id); const nm = (p.posto+" "+p.id+" "+p.nome).trim()+" _ "+(mm?mm.secao:"");
        return "<option value='"+p.id+"'"+(linha&&linha.id===p.id?" selected":"")+">"+nm+"</option>";
      }).join("");
      sel.onchange = ()=>{ if (aoEscolher(idx, sel.value) === false) sel.value = (linha && linha.id) || ""; };
      tdNome.appendChild(sel);
    } else {
      tdNome.textContent = linha ? (linha.p.posto+" "+linha.id+" "+linha.p.nome) : "";
    }
    tr.appendChild(tdNome);
    dias.forEach(d=>{
      const td = document.createElement("td");
      td.className = "dia";
      const id = linha ? linha.id : null;
      const v = id ? getMark(grupo, id, fmt(d)) : "";
      td.textContent = v;
      if (id) pintar(td, v, linha.escala);
      if (id){
        const dono = donoDaMarca(grupo, id, fmt(d));
        if (dono && dono!==grupo){
          td.style.outline = "2px dashed #000000"; td.style.outlineOffset = "-2px";
          td.title = "Lançado em "+String(dono).replace("host:","").replace(/^ADM:(.*)$/,"$1/ADM");
        }
      }
      td.onclick = ()=>{
        if (!id) return;
        abrirMenuCodigos(td, codigos, (cod)=>{
          if (marcar(grupo, id, fmt(d), cod)) desenhar();
        });
      };
      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
  main.appendChild(t);
  return t;
}

function abrirMenuCodigos(ancora, codigos, cb){
  const menu = document.getElementById("menu");
  menu.innerHTML = "";
  [""].concat(codigos).forEach(c=>{
    const b = document.createElement("button");
    b.textContent = c===""?"limpar":c;
    b.onclick = ()=>{ menu.style.display="none"; cb(c); };
    menu.appendChild(b);
  });
  menu.style.display = "grid";
  const r = ancora.getBoundingClientRect();
  menu.style.left = Math.min(r.left, window.innerWidth-320)+"px";
  menu.style.top = (r.bottom + 4)+"px";
}

function desenharAco(main){
  const h = document.createElement("p");
  h.className = "setor";
  h.textContent = "ACO — oficiais e motoristas (marcação 12 ou 24)";
  main.appendChild(h);
  const linhas = [];
  for (let i=0;i<20;i++) linhas.push(aco[i] ? D.mes.find(m=>m.id===aco[i]) : null);
  tabelaMarcavel(main, "MILITAR", "ACO", linhas, ["12","24"], (idx,val)=>{
    if (trocarMilitar("ACO", aco, idx, val||null) === false) return false;
    salvarLocal(); desenhar();
  });
  // totais do ACO
  const dias = diasDoMes();
  const t = document.createElement("table");
  t.style.marginTop = "10px";
  let hh = "<thead><tr><th style='min-width:160px'>TOTAL ACO</th>";
  dias.forEach(d=>{ const c=corDia(d); hh+="<th"+(c?" style='color:"+c+"'":"")+">"+String(d.getDate()).padStart(2,"0")+"</th>"; });
  hh+="</tr></thead><tbody>";
  t.innerHTML = hh;
  [["12h","12"],["24h","24"]].forEach(([rot,cod])=>{
    const tr=document.createElement("tr");
    tr.innerHTML="<td class='mot'>"+rot+"</td>";
    dias.forEach(d=>{
      let n=0;
      aco.forEach(id=>{ if (id && marks["ACO|"+id+"|"+fmt(d)]===cod) n++; });
      const td=document.createElement("td"); td.className="num"; td.textContent=n||"";
      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
  main.appendChild(t);
}

function getMarkExato(grupo,id,dia){ return marks[grupo+"|"+id+"|"+dia] || ""; }
function pesoMeta(v){ if(v==="X"||v==="PJ"||v==="SPJ") return 1;
  if(v==="PJ12"||v==="PJ12H"||v==="S1") return 0.5; return 0; }
function contagemSB(sb,d){
  let n=0; const dd=fmt(d);
  pessoasDaSecao(sb).forEach(m=>{ n+=pesoMeta(getMarkExato(sb,m.id,dd)); });
  pessoasAdm(sb).forEach(m=>{ n+=pesoMeta(getMarkExato("ADM:"+sb,m.id,dd)); });
  [...new Set(vis[sb]||[])].forEach(id=>{ if(!id) return; n+=pesoMeta(getMarkExato("host:"+sb,id,dd)); });
  return n;
}
function motoristasSB(sb,d){
  let n=0; const dd=fmt(d);
  pessoasDaSecao(sb).forEach(m=>{ if(m.motorista==="M") n+=pesoMeta(getMarkExato(sb,m.id,dd)); });
  pessoasAdm(sb).forEach(m=>{ if(m.motorista==="M") n+=pesoMeta(getMarkExato("ADM:"+sb,m.id,dd)); });
  [...new Set(vis[sb]||[])].forEach(id=>{
    if(!id) return;
    const mm=D.mes.find(x=>x.id===id);
    if (mm && mm.motorista==="M") n+=pesoMeta(getMarkExato("host:"+sb,id,dd));
  });
  return n;
}

function cotasDoCodigo(v){
  if (v==="PJ") return 2;
  if (v==="PJ12"||v==="PJ12H"||v==="SPJ") return 1;
  return 0;
}
function somarCotas(prefixos){
  let s=0;
  for (const k in marks){
    const p=k.split("|");
    if (prefixos.some(pre=> p[0]===pre)) s += cotasDoCodigo(marks[k]);
  }
  return s;
}

    const situ = saldo===0 ? "OK" : (saldo>0 ? "SOBRA" : "EXCESSO");

      "<td><input class='op' data-k='cotas' data-sb='"+sb+"' type='number' min='0' style='width:68px;text-align:center' value='"+dist+"'></td>"+
      "<td class='num'>"+util+"</td>"+

      const alvo={}; let somaAlvos=0;
      SBS.forEach(sb=>{ alvo[sb]=Math.max(necSB[sb], necMot[sb]); somaAlvos+=alvo[sb]; });
      if (!rec) { alert("Informe primeiro o total recebido no SEI."); return; }
      if (somaAlvos<=0) { alert("A soma dos alvos é zero; não há como distribuir."); return; }
      const jaPreenchido=SBS.some(sb=>(D.params.cotas[sb]||0)>0);
      if (jaPreenchido && !confirm("Isso vai sobrescrever as cotas já distribuídas às SBs. Continuar?")) return;
      let base={}, resto=[];
      if (rec >= somaAlvos){
        SBS.forEach(sb=>{ base[sb]=alvo[sb]; });
        const sobraTotal = rec - somaAlvos;
        SBS.forEach(sb=>{ const bruto = sobraTotal*alvo[sb]/somaAlvos;
          base[sb]+=Math.floor(bruto); resto.push({sb:sb, r:bruto-Math.floor(bruto)}); });
        let sobra = rec - SBS.reduce((a,sb)=>a+base[sb],0);
        resto.sort((x,y)=>y.r-x.r);
        for (let i=0; sobra>0 && i<resto.length; i++){ base[resto[i].sb]++; sobra--; }
      } else {
        SBS.forEach(sb=>{ const bruto=rec*alvo[sb]/somaAlvos;
          base[sb]=Math.floor(bruto); resto.push({sb:sb, r:bruto-base[sb]}); });
        let sobra = rec - SBS.reduce((a,sb)=>a+base[sb],0);
        resto.sort((x,y)=>y.r-x.r);
        for (let i=0; sobra>0 && i<resto.length; i++){ base[resto[i].sb]++; sobra--; }
        alert("O PJES recebido ("+rec+") é menor que a necessidade somada ("+somaAlvos+"). A distribuição foi feita proporcionalmente e nem todas as SBs atingem a meta.");
      }
      SBS.forEach(sb=>{ D.params.cotas[sb]=base[sb]; });
      salvarLocal(); desenhar();
    };
  },0);
}

      const mm=D.mes.find(x=>x.id===p.id);
      if (!mm) return false;
      if (mm.secao===sb) return false;
      if (sb==="1ªSB" && mm.secao==="ADM") return false;
      return true;
    }).map(p=>{
      const mm=D.mes.find(x=>x.id===p.id);
      const nm=(p.posto+" "+p.id+" "+p.nome).trim()+" _ "+(mm?mm.secao:"");
      return "<option value='"+p.id+"'"+(id===p.id?" selected":"")+">"+nm+"</option>";
    }).join("");
    sel.onchange=()=>{
      const arr=vis[sb]||[];
      const ok = trocarMilitar("host:"+sb, arr, idx, sel.value||null);
      if (ok){ vis[sb]=arr; salvarLocal(); desenhar(); }
      else { sel.value = arr[idx]||""; }
    };
    tdP.appendChild(sel); tr.appendChild(tdP);
    const tdF=document.createElement("td"); tdF.className="num";
    tdF.textContent = (m && fem[m.id])?"F":"";
    tr.appendChild(tdF);
    let ord=0, cot=0;
    dias.forEach(d=>{
      const td=document.createElement("td");
      celulaMarca(td, grupo, id, fmt(d), m?m.escala:null, ()=>desenhar());
      if (td.textContent==="X") ord++;
      if (td.textContent==="PJ") cot+=2;
      if (["PJ12","PJ12H","SPJ"].includes(td.textContent)) cot+=1;
      tr.appendChild(td);
    });
    const tdO=document.createElement("td"); tdO.className="num"; tdO.textContent=ord||""; tr.appendChild(tdO);
    const tdC=document.createElement("td"); tdC.className="num"; tdC.textContent=cot||""; tr.appendChild(tdC);
    t.appendChild(tr);
  }

  // bloco operacional
  cabecalhoBloco(sb+" — OPERACIONAL");
  pessoasDaSecao(sb).forEach((m,i)=>linhaPessoa(m, sb, i+1));

  // bloco ADM (todas as SBs; a 1ªSB recebe também o ADM central)
  const listaAdm = pessoasAdm(sb);
  if (listaAdm.length){
    cabecalhoBloco("ADMINISTRATIVO (ADM)", "SALDO");
    listaAdm.forEach((m,i)=>linhaPessoa(m, "ADM:"+sb, i+1, true));
  }

  // bloco visitantes
  cabecalhoBloco("VISITANTES — militares de outras SBs");
  for (let i=0;i<12;i++) linhaVisitante(i, "host:"+sb);

  // totais
  function linhaTot(rot, fn, classe){
    let tfoot = t.querySelector("tfoot");
    if (!tfoot) { tfoot = document.createElement("tfoot"); t.appendChild(tfoot); }

    const tr=document.createElement("tr");
    tr.className="tot";
    const totalTot = 6;
    const idx = t.querySelectorAll("tr.tot").length;
    const offset = 48 + ((totalTot - 1 - idx) * 24);
    const td=document.createElement("td");
    td.colSpan=5;
    td.style.textAlign="center";
    td.style.fontWeight="700";
    td.style.verticalAlign="middle";
    td.textContent=rot;
    tr.appendChild(td);
    const celulas=[td];
    dias.forEach(d=>{
      const c=document.createElement("td");
      const r=fn(d);
      if (typeof r==="object"){ c.innerHTML=r.texto; if(r.classe) c.className=r.classe; }
      else c.textContent=r||"";
      c.style.textAlign="center";
      celulas.push(c);
      tr.appendChild(c);
    });
    const a=document.createElement("td"); const b=document.createElement("td");
    celulas.push(a); celulas.push(b);
    tr.appendChild(a); tr.appendChild(b);
    celulas.forEach(c=>{
      c.style.position="sticky";
      c.style.zIndex="20";
      c.style.backgroundColor="#f1f3f5";
      c.style.boxSizing="border-box";
      c.style.height="24px";
    });
    tfoot.appendChild(tr);
  }
  const meta=D.params.metaBM[sb]||0, metaMot=D.params.metaMot[sb]||0;
  linhaTot("MILITARES POR DIA", d=>contagemSB(sb,d)||"");
  linhaTot("NECESSIDADE DIÁRIA", d=>meta||"");
  linhaTot("SITUAÇÃO", d=>{
    const n=contagemSB(sb,d);
    if (!meta) return {texto:""};
    if (n<meta) return {texto:"FALTA<br>"+(meta-n), classe:"falta"};
    return {texto:"OK", classe:"ok"};
  });
  linhaTot("MOTORISTAS", d=>motoristasSB(sb,d)||"");
  linhaTot("SITUAÇÃO MOT.", d=>{
    const n=motoristasSB(sb,d);
    if (!metaMot) return {texto:""};
    if (n<metaMot) return {texto:"FALTA<br>"+(metaMot-n), classe:"falta"};
    return {texto:"OK", classe:"ok"};
  });
  linhaTot("EFETIVO FEMININO", d=>{
    let n=0; const dd=fmt(d);
    pessoasDaSecao(sb).forEach(m=>{ if (fem[m.id] && getMarkExato(sb,m.id,dd)) n++; });
    pessoasAdm(sb).forEach(m=>{ if (fem[m.id] && getMarkExato("ADM:"+sb,m.id,dd)) n++; });
    [...new Set(vis[sb]||[])].forEach(id=>{ if (id && fem[id] && getMarkExato("host:"+sb,id,dd)) n++; });
    return n||"";
  });

  main.appendChild(t);
  requestAnimationFrame(()=>{
    const navEl = document.getElementById("nav");
    const navH = (navEl ? navEl.offsetHeight : 48) || 48;
    const rows = Array.from(t.querySelectorAll("tfoot tr.tot"));
    let acc = navH;
    for (let i = rows.length - 1; i >= 0; i--){
      const h = Math.round(rows[i].getBoundingClientRect().height) || 24;
      rows[i].querySelectorAll("td, th").forEach(td=>{ td.style.bottom = acc + "px"; });
      acc += h;
    }
    document.documentElement.style.setProperty("--nav-h", navH + "px");
    main.style.paddingBottom = (acc + 40) + "px";
  });
}

function trocarMilitar(grupo, lista, idx, novo){
  const antigo = lista[idx];
  if (novo){
    let duplicado = false;
    Object.keys(vis||{}).forEach(sb=>{
      (vis[sb]||[]).forEach((v,i)=>{ if (v===novo && !(grupo==="host:"+sb && i===idx)) duplicado=true; });
    });
    (aco||[]).forEach((v,i)=>{ if (v===novo && !(grupo==="ACO" && i===idx)) duplicado=true; });
    if (duplicado){ alert("Este militar já está lançado em outra linha."); return false; }
  }
  if (antigo && antigo!==novo){
    const chaves = Object.keys(marks).filter(k=>k.indexOf(grupo+"|"+antigo+"|")===0);
    if (chaves.length){
      if (!confirm("Este militar tem "+chaves.length+" marcas. Remover as marcas e trocar?")) return false;
      chaves.forEach(k=>{ delete marks[k]; });
    }
  }
  lista[idx] = novo || null;
  return true;
}
function limparOrfas(){
  let mudou = false;
  // duplicados em vis (dentro da SB e entre SBs, mantendo a primeira ocorrencia)
  const vistos = {};
  Object.keys(vis||{}).forEach(sb=>{
    const arr = [];
    [...new Set(vis[sb]||[])].forEach(id=>{
      if (!id) { arr.push(id); return; }
      if (vistos[id]) { mudou = true; return; }
      vistos[id] = sb; arr.push(id);
    });
    if (arr.length !== (vis[sb]||[]).length) mudou = true;
    vis[sb] = arr;
  });
  // duplicados em aco
  const vistosAco = {};
  const acoNovo = [];
  (aco||[]).forEach(id=>{
    if (!id) { acoNovo.push(id); return; }
    if (vistosAco[id]) { mudou = true; return; }
    vistosAco[id] = 1; acoNovo.push(id);
  });
  if (acoNovo.length !== (aco||[]).length) mudou = true;
  aco = acoNovo;
  // marcas orfas
  Object.keys(marks).forEach(k=>{
    const p=k.split("|");
    if (p[0] && p[0].indexOf("host:")===0){
      const sb=p[0].slice(5);
      if ((vis[sb]||[]).indexOf(p[1])<0) { delete marks[k]; mudou=true; }
    } else if (p[0]==="ACO"){
      if (aco.indexOf(p[1])<0) { delete marks[k]; mudou=true; }
    }
  });
  return mudou;
}
function chaveLocal(){ return "escala7gb-"+String(D.competencia).slice(0,7); }
function salvarLocal(){
 try{ localStorage.setItem(chaveLocal(), JSON.stringify({marks,vis,aco,params:D.params})); status("salvo localmente"); }catch(e){} }
function salvar(){ salvarLocal(); status("salvo"); }
function status(t){ document.getElementById("status").textContent=t; setTimeout(()=>document.getElementById("status").textContent="",2500); }
function exportar(){
  const blob=new Blob([JSON.stringify({...D,marks,vis,aco,params:D.params},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="escala-"+D.competencia.slice(0,7)+".json"; a.click();
}
function importar(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const j=JSON.parse(r.result);
    if (j.competencia && j.competencia!==D.competencia){
      if (!confirm("Arquivo de outro mês ("+j.competencia+"). Importar mesmo assim?")) return;
    }
    marks=j.marks||{}; vis=j.vis||{}; aco=j.aco||[];
    if(j.params){ D.params={...D.params,...j.params};
      ["metaBM","metaMot","cotas"].forEach(k=>{ if(j.params[k]) D.params[k]={...D.params[k],...j.params[k]}; });
    }
    salvarLocal(); status("importado");
    limparOrfas();
    salvarLocal();
    desenhar();
  }catch(e){ alert("arquivo invalido"); } };
  r.readAsText(f);
}
(function init(){
  let saved = localStorage.getItem(chaveLocal());
  if (!saved && String(D.competencia).slice(0,7)==="2026-11" && !localStorage.getItem("escala7gb-migrado")){
    const antigo = localStorage.getItem("escala7gb");
    if (antigo){
      saved = antigo;
      try{ localStorage.setItem(chaveLocal(), antigo); localStorage.setItem("escala7gb-migrado","1"); }catch(e){}
    }
  }
  if (saved) { try{ const j=JSON.parse(saved);
    if(j.marks) marks={...marks,...j.marks};
    if(j.vis) vis=j.vis;
    if(j.aco) aco=j.aco;
    if(j.params){ D.params={...D.params,...j.params};
      ["metaBM","metaMot","cotas"].forEach(k=>{ if(j.params[k]) D.params[k]={...D.params[k],...j.params[k]}; });
    }
  }catch(e){} }
  if (limparOrfas()) { try{ salvarLocal(); }catch(e){} }
  desenhar();
})();
</script></body></html>
